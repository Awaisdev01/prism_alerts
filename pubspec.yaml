name: prism_alerts
description: 'Reliable local reminders for Flutter. Persists what the user meant (local wall-clock + recurrence) and rebuilds the OS schedule after timezone changes, DST shifts and reboots, reporting missed notifications.'
version: 0.1.0
homepage:

repository: https://github.com/awaisdev5765/prism_alerts
issue_tracker: https://github.com/awaisdev5765/prism_alerts/issues

environment:
  sdk: ^3.14.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.32.0

